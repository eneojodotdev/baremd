name: baremd

services:
  backend:
    container_name: baremd-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./backend/packages/markitdown:/app/packages/markitdown
      - ./backend/packages/markitdown-ocr:/app/packages/markitdown-ocr
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BAREMD_API_KEY=${BAREMD_API_KEY:-default_secret_key_123}
      - BAREMD_CORS_ORIGINS=${BAREMD_CORS_ORIGINS:-http://localhost:3000,https://baremd.example.com}
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    container_name: baremd-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_BAREMD_API_KEY=${BAREMD_API_KEY:-default_secret_key_123}
    depends_on:
      - backend
